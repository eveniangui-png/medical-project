version: '3.8'

services:
  # 1. Service MongoDB (Instance locale containerisée)
  mongodb:
    image: mongo:latest
    container_name: mongodb-local
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db  # Volume pour persister la base de données
    restart: always

  # 2. Service de migration (Exécute le script Python dans Docker)
  migrator:
    build: .
    container_name: medical-migrator
    volumes:
      - ./healthcare_dataset.csv:/app/healthcare_dataset.csv  # Volume/Montage pour le fichier CSV
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/

# Déclaration des volumes persistants gérés par Docker
volumes:
  mongodb_data: