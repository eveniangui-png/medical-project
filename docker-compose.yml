services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb-local
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: migration-app
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/medical_db
      - DB_NAME=medical_db
      - COLLECTION_NAME=patients

volumes:
  mongodb_data: